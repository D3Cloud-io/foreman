name: CI

# A gated pipeline, cheapest first: lint → unit → integration → e2e (FRM-REQ-008). Every job needs
# the one before it, so a type error never spends three minutes waiting for a database, and a
# broken migration is found before anything renders.
#
# Every action is pinned to a commit SHA, never a tag (FRM-REQ-009): a tag is a mutable pointer, and
# an action that moves under you is a supply-chain compromise with your own credentials.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The console has to build before anything downstream can serve it.
      - run: pnpm --filter foreman-web build

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foreman
          POSTGRES_PASSWORD: foreman
          POSTGRES_DB: foreman
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foreman -d foreman"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The suite refuses outright to run against a database whose name does not end in _test,
      # and creates and migrates this one itself.
      DATABASE_URL: postgresql://foreman:foreman@127.0.0.1:5432/foreman_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration drift check — schema.prisma and migrations/ must agree
        working-directory: apps/server
        env:
          SHADOW_DATABASE_URL: postgresql://foreman:foreman@127.0.0.1:5432/shadow
        run: |
          PGPASSWORD=foreman psql -h 127.0.0.1 -U foreman -d foreman -c 'CREATE DATABASE shadow;'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
      - run: pnpm --filter foreman-server test:integration

  # Compose is what actually runs on the host, so the images are built the way they will be built
  # there — the boot order that matters (dump, then migrate) is asserted against a real one, and
  # the e2e suite drives the stack rather than a dev server.
  # The D3 App contract (FRM-T-14.4): the conformance suite D3 Constellation's contract publishes,
  # against this commit's server, as a board deployment on a migrated database: manifest, native
  # sign-in, me, refresh rotation and reuse, revoke, push through a mock relay, invitations and
  # account deletion (FRM-P-15), and throttling — the destructive checks on throwaway accounts.
  #
  # The suite's image is public, as matdemers1/d3-app-contract is, so it is pulled with no token.
  # `contract-suite` checks first that it can be: when it cannot, this job is skipped — never
  # green having run nothing — and that job's summary carries the reason (CON-T-002).
  conformance:
    name: conformance (d3-app-contract)
    needs: [unit, contract-suite]
    if: needs.contract-suite.outputs.available == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foreman
          POSTGRES_PASSWORD: foreman
          POSTGRES_DB: foreman_conformance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foreman"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://foreman:foreman@127.0.0.1:5432/foreman_conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A migrated test instance with a throwaway person
        working-directory: apps/server
        run: |
          pnpm --filter "./packages/*" build
          pnpm exec prisma migrate deploy
          CONFORMANCE_OUT="$RUNNER_TEMP/conformance.json" node --import tsx test/conformance-server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do [ -s "$RUNNER_TEMP/conformance.json" ] && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: The d3-app-contract suite
        run: |
          ARGS="$RUNNER_TEMP/conformance.json"
          docker run --rm --network host -v "$PWD:/out" ghcr.io/matdemers1/d3-app-conformance:contract-1 \
            --base "$(jq -r .base "$ARGS")" --allow-http --product foreman \
            --email "$(jq -r .email "$ARGS")" --password "$(jq -r .password "$ARGS")" \
            --totp-secret "$(jq -r .totpSecret "$ARGS")" --main-is-last-owner \
            --invite-token "$(jq -r .inviteToken "$ARGS")" --delete-email "$(jq -r .deleteEmail "$ARGS")" \
            --delete-password "$(jq -r .deletePassword "$ARGS")" --delete-totp-secret "$(jq -r .deleteTotpSecret "$ARGS")" \
            --destructive --relay-listen 18555 --junit /out/conformance.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance
          path: conformance.xml
          if-no-files-found: ignore

  # Whether the d3-app-contract suite can be fetched at all (FRM-T-14.4, CON-T-002). The contract repo
  # and its image are public, so this pulls with no token. When the image cannot be pulled — made
  # private again, a renamed tag, GHCR down — `conformance` is skipped rather than reported as a pass
  # that measured nothing, and this job's summary says why.
  contract-suite:
    name: d3-app-contract fetch probe
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Can the suite's image be pulled anonymously?
        id: probe
        env:
          IMAGE: ghcr.io/matdemers1/d3-app-conformance:contract-1
        run: |
          if out="$(docker manifest inspect "$IMAGE" 2>&1)"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "The d3-app-contract suite (\`$IMAGE\`) is pullable, so \`conformance\` runs it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=d3-app-contract suite skipped::$IMAGE cannot be pulled, so conformance is skipped: it did not run and did not pass."
          {
            echo "## d3-app-contract conformance: SKIPPED"
            echo
            echo "The suite did **not** run, so this run says nothing about the D3 App contract."
            echo
            echo "**Reason:** \`$IMAGE\` cannot be pulled anonymously:"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
            echo
            echo "The package must be public: https://github.com/users/matdemers1/packages/container/d3-app-conformance/settings"
          } >> "$GITHUB_STEP_SUMMARY"

  compose:
    needs: integration
    runs-on: ubuntu-latest
    # Every step here interpolates the compose file, and the file requires this variable
    # (`${POSTGRES_PASSWORD:?}`) rather than defaulting it — so `config` and `build` need it just
    # as much as the step that boots the stack.
    env:
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: No host ports anywhere in the base compose file (FRM-REQ-004)
        run: |
          if docker compose config | grep -q 'ports:'; then
            echo 'the base compose file publishes a port; ingress is the tunnel only' >&2
            exit 1
          fi
      - name: Build the images
        run: |
          docker compose build server worker
      - name: Boot on an empty database, and prove the dump precedes the migration
        run: |
          node scripts/dev-env.mjs
          # The worker too: attribution proposals are drained from the queue, so the activity
          # tests have nothing to assert on without it, and it is part of the deployed stack.
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml up -d --wait postgres server worker
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml logs server > server.log
          # FRM-REQ-007: the dump's path is logged, and it is logged *before* the migration runs.
          grep -q 'pre-migration dump written' server.log
          awk '/pre-migration dump written/ { dumped = NR }
               /migrations applied/ { applied = NR }
               END { if (!(dumped && applied && dumped < applied)) exit 1 }' server.log
          # FRM-REQ-017: D3 Auth is configured at a dead issuer (docker-compose.e2e.yml), and the
          # server started anyway, with the password path alone.
          grep -q 'D3 Auth discovery failed; the password path is unaffected' server.log
      - name: The seed exercises every entity, and runs twice
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml \
            exec -T -e OPERATOR_PASSWORD=ci-operator-password server \
            node dist/cli/seed-example.js
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml \
            exec -T server node dist/cli/seed-example.js
          # A second account for oidc-down.spec.ts, which enrols an authenticator on it. Not the
          # operator: an enrolled account needs a code to sign in, and every other spec signs the
          # operator in with a password alone.
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml \
            exec -T -e OPERATOR_EMAIL=totp@localhost -e OPERATOR_PASSWORD=ci-totp-password \
            server node dist/cli/seed-example.js
      # e2e last, against the stack that is already running: the exit demo is a property of the
      # deployed thing, not of a bundle a dev server happens to serve.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: e2e
        env:
          FOREMAN_URL: http://127.0.0.1:3200
          E2E_EMAIL: dev@localhost
          E2E_PASSWORD: ci-operator-password
          E2E_TOTP_EMAIL: totp@localhost
          E2E_TOTP_PASSWORD: ci-totp-password
        run: pnpm --filter e2e test
      - name: Keep the report when e2e failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Always show the logs when something failed
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml down -v

  # The only job that publishes, and only from main once the whole gate above is green. Deploying
  # stays a deliberate pull-and-restart on the host — CI builds the artifact, it does not ship it.
  #
  # Tagged by long SHA so the standing deploy rule ("report the commit SHA per image and the schema
  # revision") has something exact to report. `latest` is a convenience, never what a host pins to.
  images:
    needs: compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, worker]
    steps:
      # fetch-depth: 0 so the trailer parse below sees HEAD's own log entry rather than a
      # shallow clone with none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Shipyard (SHP) reads these two labels off the published image: `migration` decides
      # whether a failed deploy may be auto-rolled back (a `contract` release never is,
      # SHP-D-057), and `schema` is what /health's schemaRevision is compared against after
      # boot. See docs/runbooks/deploy.md.
      - id: shipyard-labels
        name: Compute Shipyard labels from the HEAD commit's trailer
        run: bash scripts/shipyard-labels.sh | tee -a "$GITHUB_OUTPUT"
      # Image names must be lowercase and the owner is not (D3Cloud-io, GL-006), so the base is
      # computed once here rather than written from github.repository in two places.
      - id: base
        name: Lowercase the image base
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.base.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
          labels: |
            dev.d3cloud.shipyard.migration=${{ steps.shipyard-labels.outputs.migration }}
            dev.d3cloud.shipyard.schema=${{ steps.shipyard-labels.outputs.schema }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # The Zima host is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the pushed image carries both Shipyard labels
        run: |
          set -euo pipefail
          image="${{ steps.base.outputs.image }}:sha-${{ github.sha }}"
          labels="$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' | jq '.config.Labels')"
          echo "$labels" | jq -e --arg v "${{ steps.shipyard-labels.outputs.migration }}" \
            '.["dev.d3cloud.shipyard.migration"] == $v' > /dev/null
          echo "$labels" | jq -e --arg v "${{ steps.shipyard-labels.outputs.schema }}" \
            '.["dev.d3cloud.shipyard.schema"] == $v' > /dev/null
